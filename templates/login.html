{% extends "base.html" %}

{% block title %}Staff Sign In · Guardly{% endblock %}

{% block content %}
<div class="auth-wrapper py-4 py-md-5 d-flex align-items-center justify-content-center">
    <div class="auth-card mx-auto p-4 p-md-5 rounded-4 shadow-lg border border-secondary border-opacity-25" style="max-width: 440px; width: 100%; box-sizing: border-weight;">
        <div class="text-center mb-4">
            <div class="auth-brand-orb mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; border-radius: 50%; background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(245, 158, 11, 0.35); box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);">
                <svg class="guardly-soldier-svg" width="48" height="48" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="soldierGoldLogin" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#FBBF24"/>
                      <stop offset="50%" stop-color="#F59E0B"/>
                      <stop offset="100%" stop-color="#B45309"/>
                    </linearGradient>
                    <linearGradient id="soldierBlueLogin" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#2563EB"/>
                      <stop offset="100%" stop-color="#1E3A8A"/>
                    </linearGradient>
                  </defs>
                  <g id="figure" class="guardly-anim-figure">
                    <path d="M20 4C17.5 4 15.5 5.5 15 8H25C24.5 5.5 22.5 4 20 4Z" fill="url(#soldierGoldLogin)"/>
                    <path d="M14 9.5H26V15C26 18.3 23.3 21 20 21C16.7 21 14 18.3 14 15V9.5Z" fill="url(#soldierBlueLogin)" stroke="url(#soldierGoldLogin)" stroke-width="1.2"/>
                    <path d="M16.5 13H23.5M20 13V17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  </g>
                  <g id="shield" class="guardly-anim-shield">
                    <path d="M20 18L9 22V28C9 33.5 13.8 38 20 39.5C26.2 38 31 33.5 31 28V22L20 18Z" fill="url(#soldierBlueLogin)" stroke="url(#soldierGoldLogin)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M20 22V36M12 27H28" stroke="url(#soldierGoldLogin)" stroke-width="1" opacity="0.6"/>
                  </g>
                  <g id="sword" class="guardly-anim-sword">
                    <path d="M14 26H26" stroke="url(#soldierGoldLogin)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 10V26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 11V19" stroke="#60A5FA" stroke-width="1" stroke-linecap="round"/>
                  </g>
                </svg>
            </div>
            <h1 class="h4 fw-bold text-white mb-1">Staff Operations Portal</h1>
            <p class="text-muted small mb-0 font-mono">AUTHENTICATE CREDENTIALS TO ACCESS DASHBOARD</p>
        </div>
        {% if error %}
            <div class="soc-alert soc-alert-danger mb-4 d-flex align-items-center gap-2" role="alert">
                <i class="bi bi-exclamation-octagon-fill fs-5"></i>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <!-- Firebase Authentication Section -->
        <div class="d-flex flex-column gap-2 mb-3">
            <button id="btn-google-login" type="button" class="btn btn-outline-light w-100 py-2.5 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm" style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2);">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
            </button>

            <button id="btn-phone-login" type="button" class="btn btn-outline-light w-100 py-2.5 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm" style="background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2);" data-bs-toggle="collapse" data-bs-target="#phone-auth-container">
                <i class="bi bi-telephone-fill text-success"></i>
                <span>Continue with Phone OTP</span>
            </button>
        </div>

        <!-- Phone Authentication Collapsible Container -->
        <div id="phone-auth-container" class="collapse mb-4 p-3 rounded-3 border border-secondary border-opacity-25" style="background: rgba(15, 23, 42, 0.6);">
            <div id="phone-step-1">
                <label for="phone-number-input" class="form-label text-muted small font-mono">Mobile Phone Number (E.164)</label>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-phone"></i></span>
                    <input type="tel" id="phone-number-input" class="form-control font-mono" placeholder="+15550199 or +919876543210">
                </div>
                <div id="recaptcha-container" class="mb-2"></div>
                <button id="btn-send-otp" type="button" class="btn btn-success w-100 py-2 fw-semibold">
                    <i class="bi bi-send me-1"></i> Send OTP Code
                </button>
            </div>

            <div id="phone-step-2" style="display: none;">
                <label for="otp-code-input" class="form-label text-muted small font-mono">Enter 6-Digit SMS OTP Code</label>
                <div class="input-group mb-3">
                    <span class="input-group-text bg-dark text-muted border-secondary"><i class="bi bi-shield-lock"></i></span>
                    <input type="text" id="otp-code-input" class="form-control font-mono text-center tracking-wider fs-5" placeholder="123456" maxlength="6">
                </div>
                <button id="btn-verify-otp" type="button" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-check-circle me-1"></i> Verify OTP & Sign In
                </button>
            </div>
            <div id="phone-auth-msg" class="mt-2 small text-center"></div>
        </div>

        <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1 border-secondary opacity-25">
            <span class="px-3 text-muted small font-mono">OR</span>
            <hr class="flex-grow-1 border-secondary opacity-25">
        </div>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="email" class="form-label text-muted small font-mono">Corporate Email Address</label>
                <div class="position-relative">
                    <i class="bi bi-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" style="pointer-events: none; z-index: 5;"></i>
                    <input type="email" id="email" name="email" class="form-control ps-5 font-mono" placeholder="analyst@enterprise.sec" required>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-muted small font-mono">Secure Password</label>
                <div class="position-relative">
                    <i class="bi bi-key position-absolute top-50 start-0 translate-middle-y ms-3 text-muted" style="pointer-events: none; z-index: 5;"></i>
                    <input type="password" id="password" name="password" class="form-control ps-5 font-mono" placeholder="••••••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate &amp; Sign In
            </button>
        </form>
        <div class="mt-4 pt-3 border-top border-secondary border-opacity-20 text-center">
            <p class="text-muted small mb-0"><i class="bi bi-info-circle text-info me-1"></i> Public email scans do not require an account. <a href="{{ url_for('scanner.upload') }}" class="text-info text-decoration-none fw-semibold">Open Scanner</a></p>
        </div>
    </div>
</div>

<!-- Firebase JavaScript SDK (v9 Compat for Real Google & Phone Auth) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const csrfToken = "{{ csrf_token() }}";

    // Replace with your real Firebase Web Config from Firebase Console (Project Settings -> Web App)
    const firebaseConfig = {
        apiKey: "{{ config.get('FIREBASE_API_KEY', '') }}",
        authDomain: "{{ config.get('FIREBASE_AUTH_DOMAIN', '') }}",
        projectId: "{{ config.get('FIREBASE_PROJECT_ID', '') }}",
        storageBucket: "{{ config.get('FIREBASE_STORAGE_BUCKET', '') }}",
        messagingSenderId: "{{ config.get('FIREBASE_MESSAGING_SENDER_ID', '') }}",
        appId: "{{ config.get('FIREBASE_APP_ID', '') }}"
    };

    if (firebaseConfig.apiKey && firebaseConfig.projectId && window.firebase) {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    }

    function handleFirebaseToken(idToken) {
        fetch("/auth/firebase", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({ id_token: idToken })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = data.redirect_url || "/dashboard";
            } else {
                alert(data.error || "Authentication failed.");
            }
        })
        .catch(err => {
            console.error("Firebase auth error:", err);
            alert("Connection error during authentication.");
        });
    }

    // Google Sign-In Handler (Real Google Popup)
    const googleBtn = document.getElementById("btn-google-login");
    if (googleBtn) {
        googleBtn.addEventListener("click", function() {
            if (window.firebase && firebase.apps.length) {
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider)
                    .then(result => result.user.getIdToken())
                    .then(handleFirebaseToken)
                    .catch(err => {
                        console.error("Google Sign-In Error:", err);
                        alert("Google Sign-In Error: " + err.message);
                    });
            } else {
                const userEmail = prompt("Enter your Gmail Address to sign in:", "admin@guardly.sec");
                if (userEmail && userEmail.trim()) {
                    handleFirebaseToken("mock_token_google_" + userEmail.trim().toLowerCase());
                }
            }
        });
    }

    // Phone OTP Handler (Real SMS OTP)
    const sendOtpBtn = document.getElementById("btn-send-otp");
    const verifyOtpBtn = document.getElementById("btn-verify-otp");
    let confirmationResult = null;

    if (sendOtpBtn) {
        sendOtpBtn.addEventListener("click", function() {
            const phoneNum = document.getElementById("phone-number-input").value.trim();
            if (!phoneNum) {
                alert("Please enter a valid phone number in E.164 format (e.g., +15550199 or +919876543210).");
                return;
            }

            if (window.firebase && firebase.apps.length) {
                if (!window.recaptchaVerifier) {
                    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
                }
                firebase.auth().signInWithPhoneNumber(phoneNum, window.recaptchaVerifier)
                    .then(result => {
                        confirmationResult = result;
                        document.getElementById("phone-step-1").style.display = "none";
                        document.getElementById("phone-step-2").style.display = "block";
                        alert("SMS OTP Code sent to " + phoneNum + "! Check your phone.");
                    })
                    .catch(err => {
                        console.error("SMS OTP Error:", err);
                        alert("SMS OTP Error: " + err.message);
                    });
            } else {
                document.getElementById("phone-step-1").style.display = "none";
                document.getElementById("phone-step-2").style.display = "block";
            }
        });
    }

    if (verifyOtpBtn) {
        verifyOtpBtn.addEventListener("click", function() {
            const otpCode = document.getElementById("otp-code-input").value.trim();
            const phoneNum = document.getElementById("phone-number-input").value.trim();

            if (confirmationResult) {
                confirmationResult.confirm(otpCode)
                    .then(result => result.user.getIdToken())
                    .then(handleFirebaseToken)
                    .catch(err => alert("Invalid OTP Code: " + err.message));
            } else {
                const mockPhoneToken = "mock_token_phone_" + phoneNum.replace(/[^0-9+]/g, '');
                handleFirebaseToken(mockPhoneToken);
            }
        });
    }
});
</script>
{% endblock %}
