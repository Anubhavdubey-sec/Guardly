{% extends "base.html" %}

{% block title %}Change Password · Guardly{% endblock %}

{% block content %}
<div class="auth-wrapper py-4 py-md-5 d-flex align-items-center justify-content-center">
    <div class="auth-card mx-auto p-4 p-md-5 rounded-4 shadow-lg border border-secondary border-opacity-25" style="max-width: 520px; width: 100%;">
        <div class="mb-4">
            <p class="eyebrow mb-1 text-primary fw-bold font-mono"><i class="bi bi-key-fill me-1"></i> ACCOUNT SECURITY</p>
            <h1 class="h3 fw-bold text-white mb-1">Change password</h1>
            <p class="text-muted small mb-0">Use a unique passphrase of 12–128 characters. Long, memorable phrases are encouraged.</p>
        </div>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label for="old_password" class="form-label text-muted small font-mono">Current password</label>
                <input type="password" id="old_password" name="old_password" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="mb-3 password-field-container">
                <label for="new_password" class="form-label text-muted small font-mono">New passphrase</label>
                <input type="password" id="new_password" name="new_password" class="form-control guardly-password-input" autocomplete="new-password" minlength="12" maxlength="128" required>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="form-label text-muted small font-mono">Confirm new passphrase</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="12" maxlength="128" required>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-shield-check me-1"></i> Update password</button>
                <a class="btn btn-outline-light" href="{{ url_for('auth.dashboard') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
