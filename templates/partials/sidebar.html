<aside id="socSidebar" class="soc-sidebar">
    <div class="sidebar-brand p-3 d-flex align-items-center justify-content-between">
        <a href="{{ url_for('auth.dashboard') }}" class="brand-link text-decoration-none d-flex align-items-center gap-2 min-w-0 flex-shrink-1">
            <div class="brand-icon-wrapper flex-shrink-0">
                <svg class="pg-logo-svg" width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="soldierGoldGradSide" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#FBBF24"/>
                      <stop offset="50%" stop-color="#F59E0B"/>
                      <stop offset="100%" stop-color="#B45309"/>
                    </linearGradient>
                    <linearGradient id="soldierBlueGradSide" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#2563EB"/>
                      <stop offset="100%" stop-color="#1E3A8A"/>
                    </linearGradient>
                  </defs>
                  <g id="figure">
                    <path d="M20 4C17.5 4 15.5 5.5 15 8H25C24.5 5.5 22.5 4 20 4Z" fill="url(#soldierGoldGradSide)"/>
                    <path d="M14 9.5H26V15C26 18.3 23.3 21 20 21C16.7 21 14 18.3 14 15V9.5Z" fill="url(#soldierBlueGradSide)" stroke="url(#soldierGoldGradSide)" stroke-width="1.2"/>
                    <path d="M16.5 13H23.5M20 13V17" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  </g>
                  <g id="shield">
                    <path d="M20 18L9 22V28C9 33.5 13.8 38 20 39.5C26.2 38 31 33.5 31 28V22L20 18Z" fill="url(#soldierBlueGradSide)" stroke="url(#soldierGoldGradSide)" stroke-width="1.5" stroke-linejoin="round"/>
                    <path d="M20 22V36M12 27H28" stroke="url(#soldierGoldGradSide)" stroke-width="1" opacity="0.6"/>
                  </g>
                  <g id="sword">
                    <path d="M14 26H26" stroke="url(#soldierGoldGradSide)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 10V26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 11V19" stroke="#60A5FA" stroke-width="1" stroke-linecap="round"/>
                  </g>
                </svg>
            </div>
            <div class="d-flex flex-column min-w-0 overflow-hidden sidebar-brand-text">
                <span class="fw-bold text-white fs-5 lh-1 brand-name text-truncate">Guardly</span>
            </div>
        </a>
        <button id="sidebarCollapse" class="sidebar-collapse-trigger flex-shrink-0 ms-auto d-none d-lg-flex" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
            <i class="bi bi-layout-sidebar-inset"></i>
        </button>
        <button id="sidebarCloseBtn" class="btn-close btn-close-white flex-shrink-0 d-lg-none ms-auto p-2" type="button" aria-label="Close sidebar"></button>
    </div>
    <nav class="sidebar-nav px-3 py-3">
        <div class="nav-section-title font-mono">INVESTIGATION WORKSPACE</div>
        <ul class="nav flex-column gap-1 mb-4">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'auth.dashboard' %}active{% endif %}" href="{{ url_for('auth.dashboard') }}">
                    <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'scanner.upload' %}active{% endif %}" href="{{ url_for('scanner.upload') }}">
                    <i class="bi bi-cloud-arrow-up"></i> <span>Scan Sample</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'scanner.history' %}active{% endif %}" href="{{ url_for('scanner.history') }}">
                    <i class="bi bi-layers-half"></i> <span>Investigation History</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'graph.view_threat_graph' %}active{% endif %}" href="{{ url_for('graph.view_threat_graph') }}">
                    <i class="bi bi-diagram-3-fill"></i> <span>Threat Graph</span>
                </a>
            </li>
        </ul>

        {% if current_user and current_user.role == 'admin' %}
            <div class="nav-section-title font-mono">ADMINISTRATION</div>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
                        <i class="bi bi-speedometer"></i> <span>Admin Overview</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}" href="{{ url_for('admin.users') }}">
                        <i class="bi bi-people-fill"></i> <span>User Control</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.logs' %}active{% endif %}" href="{{ url_for('admin.logs') }}">
                        <i class="bi bi-journal-code"></i> <span>Audit Logs</span>
                    </a>
                </li>
            </ul>
        {% endif %}
    </nav>
    <div class="sidebar-footer p-3 mt-auto border-top border-secondary border-opacity-10">
        <div class="engine-badge d-flex align-items-center gap-2 text-muted small">
            <i class="bi bi-cpu text-info"></i>
            <span class="font-mono" style="font-size: 0.72rem;">v2.4 Local Engine</span>
        </div>
    </div>
</aside>
