<aside id="socSidebar" class="soc-sidebar">
    <div class="sidebar-brand p-3">
        <a href="{{ url_for('auth.dashboard') }}" class="brand-link text-decoration-none d-flex align-items-center gap-2 min-w-0">
            <div class="brand-icon-wrapper flex-shrink-0">
                <svg class="pg-logo-svg" width="30" height="30" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="pgShieldGradSide" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#3B82F6"/>
                      <stop offset="100%" stop-color="#1D4ED8"/>
                    </linearGradient>
                    <linearGradient id="pgGlowGradSide" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8"/>
                      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
                    </linearGradient>
                  </defs>
                  <path d="M18 3L4 9V17C4 25.5 10 32.2 18 34C26 32.2 32 25.5 32 17V9L18 3Z" fill="url(#pgShieldGradSide)" stroke="#60A5FA" stroke-width="1.5" stroke-linejoin="round"/>
                  <path d="M18 5L6 10.2V17C6 24.3 11.2 30.2 18 31.8C24.8 30.2 30 24.3 30 17V10.2L18 5Z" fill="url(#pgGlowGradSide)" opacity="0.3"/>
                  <path d="M13 17.5L16.5 21L23 13.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="d-flex flex-column min-w-0 overflow-hidden sidebar-brand-text">
                <span class="fw-bold text-white fs-5 lh-1 brand-name text-truncate">PhishGuard</span>
            </div>
        </a>
        <button id="sidebarCollapse" class="sidebar-collapse-trigger ms-auto d-none d-lg-flex" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
            <i class="bi bi-layout-sidebar-inset"></i>
        </button>
        <button id="sidebarCloseBtn" class="btn-close btn-close-white d-lg-none ms-auto p-2" type="button" aria-label="Close sidebar"></button>
    </div>
    <nav class="sidebar-nav px-3 py-3">
        <div class="nav-section-title font-mono">INVESTIGATION WORKSPACE</div>
        <ul class="nav flex-column gap-1 mb-4">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'auth.dashboard' %}active{% endif %}" href="{{ url_for('auth.dashboard') }}">
                    <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'scanner.upload' %}active{% endif %}" href="{{ url_for('scanner.upload') }}">
                    <i class="bi bi-cloud-arrow-up"></i> <span>Scan Sample</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'scanner.history' %}active{% endif %}" href="{{ url_for('scanner.history') }}">
                    <i class="bi bi-layers-half"></i> <span>Investigation History</span>
                </a>
            </li>
        </ul>

        {% if current_user and current_user.role == 'admin' %}
            <div class="nav-section-title font-mono">ADMINISTRATION</div>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
                        <i class="bi bi-speedometer"></i> <span>Admin Overview</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.users' %}active{% endif %}" href="{{ url_for('admin.users') }}">
                        <i class="bi bi-people-fill"></i> <span>User Control</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.endpoint == 'admin.logs' %}active{% endif %}" href="{{ url_for('admin.logs') }}">
                        <i class="bi bi-journal-code"></i> <span>Audit Logs</span>
                    </a>
                </li>
            </ul>
        {% endif %}
    </nav>
    <div class="sidebar-footer p-3 mt-auto border-top border-secondary border-opacity-10">
        <div class="engine-badge d-flex align-items-center gap-2 text-muted small">
            <i class="bi bi-cpu text-info"></i>
            <span class="font-mono" style="font-size: 0.72rem;">v2.4 Local Engine</span>
        </div>
    </div>
</aside>
